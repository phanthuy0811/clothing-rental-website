<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="stylesheet" href="vi.css">
    <link rel="stylesheet" href="/user/auth.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="/user/home/home.html">
                <img src="/user/Logo.png" alt="Logo">
            </a>
        </div>
        <div class="icons">
            <a href="/user/profile/profile.html">
                <img id="user-avatar" src="/user/user.png" alt="Hồ sơ" class="user-icon">
            </a>
            <a href="/user/giohang/giohang.html">
                <img id="cart-avatar" src="/user/cart.jpg" alt="Giỏ hàng" class="cart-icon">
            </a>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <ul>
                <li><a href="/user/profile/profile.html">Hồ sơ</a></li>
                <li><a href="/user/lichsu/lichsu.html">Đơn hàng</a></li>
                <li><a href="/user/vi/vi.html">Ví</a></li>
            </ul>
        </nav>

        <main class="wallet">
            <div class="balance-container">
                <p>Số dư tài khoản: <span id="balance">1,000,000 VNĐ</span></p>
                <button class="nap-btn">Nạp tiền</button>
            </div>
        </main>
    </div>


    <div class="payment-modal-overlay" id="payment-modal">
        <div class="payment-box">
            <button id="modal-close" class="close-btn">×</button>
            <p><strong>Số dư tài khoản:</strong> <span id="soDu">Đang tải...</span></p>
            <p><strong>Số tiền cần nạp:</strong></p>
            <input type="number" id="amount-input" placeholder="Nhập số tiền" min="1000" step="1000" class="amount-input">
            <div class="buttons">
                <button class="top-up" id="top-up-btn">Nạp tiền</button>
            </div>
        </div>
    </div>



    <script type="module" src="/user/auth.js"></script>
    <script type="module" src="vi.js"></script>
</body>
</html>
