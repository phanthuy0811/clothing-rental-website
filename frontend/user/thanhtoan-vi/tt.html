<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện thanh toán</title>
    <link rel="stylesheet" href="tt.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="/user/home/home.html">
                <img src="/user/Logo.png" alt="Logo">
            </a>
        </div>

        <div class="icons">
            <a href="/user/profile/profile.html">
                <img id="user-avatar" src="/user/user.png" alt="User Avatar" class="user-icon">
            </a>
            <a href="/user/giohang/giohang.html">
                <img id="cart-avatar" src="/user/cart.jpg" alt="Cart Avatar" class="cart-icon">
            </a>
        </div>
    </header>

    <main>
        <div class="payment-box">
            <p><strong>Số dư tài khoản:</strong> 500,000 VNĐ</p>
            <p><strong>Số tiền phải thanh toán:</strong> 100,000 VNĐ</p>
            <div class="buttons">
                <button class="pay">Thanh toán</button>

                
                <a href="/user/nap/nap.html">
                    <button class="top-up">Nạp tiền</button>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
