<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Tiền</title>
    <link rel="stylesheet" href="nap.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <a href="/user/home/home.html">
                <img src="/user/Logo.png" alt="Logo">
            </a>
        </div>
        
        <div class="icons">
            <a href="/user/profile/profile.html">
                <img id="user-avatar" src="/user/user.png" alt="User Avatar" class="user-icon">
            </a>
            <a href="/user/giohang/giohang.html">
                <img id="cart-avatar" src="/user/cart.jpg" alt="Cart Avatar" class="cart-icon">
            </a>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main>
        <div class="payment-box">
            <p><strong>Số dư tài khoản:</strong> 500.000đ</p>
            <p><strong>Số tiền cần nạp:</strong></p>
            <input type="number" class="money-input" placeholder="Nhập số tiền..." min="1000">
            <div class="buttons">
                <!-- <button class="pay">Thanh toán</button> -->
                <button class="top-up">Nạp</button>
            </div>
        </div>
    </main>

</body>
</html>
