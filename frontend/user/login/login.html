<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <a href="/user/home/home.html">
                <img src="/user/logo.png" alt="Logo">
            </a>
        </div>
       
    </header>

    <div class="container">
        <div class="login-box">
            <form id="loginForm">

                <label>Tên đăng nhập</label>
                <input type="text" id="userName" placeholder="Nhập tên đăng nhập" required>
            
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            
                <button type="submit" class="login-btn">Đăng nhập</button>
            </form>
            <p id="message" style="color: red; text-align: center;"></p>

            <p class="forgot-password"><a href="/user/quenmatkhau/email.html">Quên mật khẩu</a></p>

            <p class="register-link">Bạn đã có tài khoản? <a href="/user/register/register.html">Đăng ký</a></p>
        </div>
    </div>

    <script src="login.js"></script>

</body>
</html>
