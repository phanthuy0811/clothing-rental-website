<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="/user/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <a href="home.html">
                <img src="/user/logo.png" alt="Logo">
            </a>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm kiếm...">
                <i class="fas fa-search"></i>
            </div>

            <button id="search-button" class="search-btn">Tìm kiếm</button>

        </div>
        
       <!-- Thay đổi phần user icon -->
        <div class="icons">
            <a href="/user/profile/profile.html">
                <img id="user-avatar" src="/user/user.png" alt="User Avatar" class="user-icon">
            </a>
            <a href="/user/giohang/giohang.html">
                <img id="cart-avatar" src="/user/cart.jpg" alt="Cart Avatar" class="cart-icon">
            </a>
        </div>

    </header>

    <!-- Banner -->
    <div class="banner">
        <img src="/user/home.webp" alt="Clothing Store">
    </div>

    <!-- Danh mục sản phẩm -->
    <section class="categories">
        <h2>Danh mục sản phẩm</h2>
        <div class="category-list">
            <div class="category-item">
                <img src="/user/category.png" alt="Mẫu 1">
                <p>Mẫu 1</p>
            </div>
            <div class="category-item">
                <img src="/user/category.png" alt="Mẫu 1">
                <p>Mẫu 2</p>
            </div>
            <div class="category-item">
                <img src="/user/category.png" alt="Mẫu 1">
                <p>Mẫu 3</p>
            </div>
            <div class="category-item">
                <img src="/user/category.png" alt="Mẫu 1">
                <p>Mẫu 4</p>
            </div>
        </div>
    </section>

    <!-- Sản phẩm mới -->
    <section class="new-products">
        <h2>Sản phẩm mới</h2>
        <div class="product-list">
            <div class="product-item">
                <a href="/user/sanpham/sanpham.html">
                    <img src="/user/banner.jpg" alt="Sản phẩm 1">
                </a>
                <p>Sản phẩm 1</p>
                <p>Giá thuê: xxx VND</p>
            </div>
            <div class="product-item">
                <a href="/user/sanpham/sanpham.html">
                    <img src="/user/banner.jpg" alt="Sản phẩm 2">
                </a>
                <p>Sản phẩm 1</p>
                <p>Giá thuê: xxx VND</p>
            </div>
            <div class="product-item">
                <a href="/user/sanpham/sanpham.html">
                    <img src="/user/banner.jpg" alt="Sản phẩm 3">
                </a>
                <p>Sản phẩm 1</p>
                <p>Giá thuê: xxx VND</p>
            </div>
            <div class="product-item">
                <a href="/user/sanpham/sanpham.html">
                    <img src="/user/banner.jpg" alt="Sản phẩm 4">
                </a>
                <p>Sản phẩm 1</p>
                <p>Giá thuê: xxx VND</p>
            </div>
        </div>

        <div class="pagination"></div>
    </section>

    <script type="module" src="home.js"></script>
    <script type="module" src="/user/auth.js"></script>
</body>
</html>
