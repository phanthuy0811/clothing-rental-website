<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="stylesheet" href="nhapmatkhau.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <a href="/user/home/home.html">
                <img src="/user/logo.png" alt="Logo">
            </a>
        </div>
       
    </header>

    <div class="container">
        <div class="resetPassword-box">
            <form id="passwordForm">
            
                <label>Mật khẩu mới</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu mới" required>

                <label>Xác nhận mật khẩu</label>
                <input type="reset-password" id="reset-password" required>
            
                <button type="submit" class="password-btn">Lưu</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>

</body>
</html>
