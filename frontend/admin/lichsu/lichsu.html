<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard - Đơn hàng</title>
    <link rel="stylesheet" href="lichsu.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>
    <div class="header">
        <div class="logo">
            <a href="/user/home/home.html">
                <img src="/admin/Logo.png" alt="Logo"/>
            </a>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm..."/>
                <i class="fas fa-search"></i>
            </div>
            <button class="search-btn">Tìm kiếm</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <ul>
                <li><a href="/admin/dashboad/dashboad.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="/admin/user/user.html"><i class="fas fa-users"></i> Người dùng</a></li>
                <li><a href="/admin/lichsu/lichsu.html"><i class="fas fa-receipt"></i> Đơn hàng</a></li>
                <li><a href="/admin/danhmuc/danhmuc.html"><i class="fas fa-list"></i> Danh mục</a></li>
                <li><a href="/admin/sanpham/sanpham.html"><i class="fas fa-box"></i> Sản phẩm</a></li>
                <li><a href="/admin/chitiet/chitiet.html"><i class="fas fa-info-circle"></i> Chi tiết</a></li>
            </ul>
        </div>

        <<div class="main-content">
            <label for="status-filter">Lọc theo trạng thái:</label>
            <select id="status-filter">
                <option value="all">-----</option>
                <option value="PENDING">Chưa thanh toán</option>
                <option value="PARTIALLY_PAID">Đã đặt cọc</option>
                <option value="PAID">Đã thanh toán</option>
                <option value="CANCELLED">Đã hủy</option>
            </select>


            <div class="table-container" id="order-container">
                <!-- Đơn hàng sẽ được render bằng JavaScript -->
            </div>

            <div id="pagination" class="pagination"></div>
        </div>

    </div>

    <script type="module" src="lichsu.js"></script>
</body>
</html>
